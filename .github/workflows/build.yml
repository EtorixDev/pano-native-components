name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build libs

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2025-vs2026, ubuntu-24.04, ubuntu-24.04-arm]
        include:
        - os: windows-2025-vs2026
          resources-dir: windows-x64
        - os: ubuntu-24.04
          resources-dir: linux-x64
        - os: ubuntu-24.04-arm
          resources-dir: linux-arm64

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - name: Set Up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkitgtk-6.0-dev dbus-daemon

    - name: Update Dependencies
      run: cargo update

    - name: Test Native Tray
      if: runner.os == 'Linux'
      run: cargo test -p pano-native-components

    - name: Test Artifact Staging
      env:
        PYTHONDONTWRITEBYTECODE: '1'
      run: python -m unittest discover -s scripts -p 'test_*.py'

    - name: Build Native Libraries
      run: python scripts/build_native.py --output-dir target/pano-artifacts/${{ matrix.resources-dir }} --release

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: libs-${{ matrix.resources-dir }}
        path: target/pano-artifacts/${{ matrix.resources-dir }}/
        if-no-files-found: error
